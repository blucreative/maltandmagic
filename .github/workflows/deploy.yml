name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.private' --exclude='.test-output' --exclude='*.md' --exclude='*.markdown' --exclude='node_modules' --exclude='/workers' --exclude='/site' --exclude='/EveOfRuin' --exclude='/Daggerheart/scripts' --exclude='/Daggerheart/test' --exclude='/Daggerheart/test-output' --exclude='/Daggerheart/package*.json' ./ site/
          mkdir -p site/EveOfRuin/vendor site/EveOfRuin/data site/EveOfRuin/media
          # Publish generated reference data, never private inputs or raw Markdown.
          rsync -a EveOfRuin/index.html EveOfRuin/portal.css EveOfRuin/app.mjs EveOfRuin/model.mjs EveOfRuin/storage.mjs EveOfRuin/markdown.mjs EveOfRuin/sw.js site/EveOfRuin/
          rsync -a EveOfRuin/vendor/marked.esm.js EveOfRuin/vendor/LICENSE site/EveOfRuin/vendor/
          rsync -a EveOfRuin/data/ site/EveOfRuin/data/
          rsync -a EveOfRuin/media/ site/EveOfRuin/media/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4