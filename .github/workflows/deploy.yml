name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.private' --exclude='node_modules' --exclude='/workers' --exclude='/site' --exclude='/EveOfRuin' --exclude='/Daggerheart/scripts' --exclude='/Daggerheart/test' --exclude='/Daggerheart/test-output' --exclude='/Daggerheart/package*.json' ./ site/
          mkdir -p site/EveOfRuin/vendor
          # Explicit public allowlist: never publish imported adventure data or Markdown.
          rsync -a EveOfRuin/index.html EveOfRuin/portal.css EveOfRuin/app.mjs EveOfRuin/model.mjs EveOfRuin/storage.mjs EveOfRuin/markdown.mjs EveOfRuin/sw.js site/EveOfRuin/
          rsync -a EveOfRuin/vendor/marked.esm.js EveOfRuin/vendor/LICENSE site/EveOfRuin/vendor/
          if find site/EveOfRuin -type f \( -name '*.md' -o -name '*.json' \) | grep -q .; then
            echo "Private adventure material found in the public portal artifact" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4